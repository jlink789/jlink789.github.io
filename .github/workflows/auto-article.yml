name: 自动采集 + AI 生成文章 + 配图 + 资讯中心更新

on:
  # 2026-11-11 起暂停每日自动日更（老板确认，止血）。
  # 原 cron "0 2 * * *"（北京 10:00）每天产出 10 篇，累计 1164 篇占全站 URL 89.3%，
  # 82.6% 页面共享同一句模板文案、每篇 73.8% 句子为跨篇复现句，继续发会持续稀释站级质量分。
  # 恢复条件：auto_article.py 接入按选题专属的真实内容源并通过 quality_gate() 质量门槛。
  # 注意：本工作流 name 被 deploy-aliyun.yml 的 workflow_run 名单引用，改名必须同步。
  workflow_dispatch:

concurrency:
  group: auto-article
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install --no-cache-dir requests Pillow

      - name: 自动生成文章 + 配图
        run: python scripts/auto_article.py

      - name: 重新生成 news.html + en-news.html + 同步首页
        run: python scripts/build_news.py

      - name: 全站生成 sitemap.xml（核心页+英文版+文章，含 hreflang）
        run: python scripts/gen_sitemap.py

      - name: 百度主动推送
        continue-on-error: true
        run: python scripts/baidu_push.py

      - name: IndexNow 推送（Bing / Yandex）
        continue-on-error: true
        run: python scripts/indexnow_push.py --today

      - name: 提交并推送
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "auto"
          git config --global user.email "auto@auto.com"
          git add .
          if git diff --cached --quiet; then
            echo "✅ 无变更，跳过提交"
          else
            git commit -m "自动资讯更新 $(date +'%Y-%m-%d')"
            # 并发推送兜底：远端若已前进（别人的提交先落地），把本次改动叠到最新 main 上再推
            for i in 1 2 3; do
              if git push; then echo "✅ 已提交并推送"; exit 0; fi
              echo "push 失败，第 $i 次重试：对齐最新 main 后重新提交"
              git fetch origin main
              git reset --soft origin/main
              git commit -m "自动资讯更新 $(date +'%Y-%m-%d')" || true
              sleep 5
            done
            echo "❌ 推送三次仍失败"; exit 1
          fi
