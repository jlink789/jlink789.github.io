name: 知识库增长（每周自动新增白皮书专题）

on:
  schedule:
    - cron: "30 18 * * 0"   # 每周日 18:30 UTC = 周一 02:30 北京时间
  workflow_dispatch:

concurrency:
  group: knowledge-grow
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 发布一个队列专题并重新生成知识库
        run: python scripts/knowledge_grow.py

      - name: 重建 sitemap.xml
        run: python scripts/gen_sitemap.py

      - name: 提交并推送
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "auto"
          git config --global user.email "auto@auto.com"
          git add .
          if git diff --cached --quiet; then
            echo "✅ 无变更，跳过提交"
          else
            git commit -m "知识库增长自动发布 $(date +'%Y-%m-%d')"
            git push
            echo "✅ 已提交并推送"
          fi
